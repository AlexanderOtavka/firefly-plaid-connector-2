name: Update dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Mondays at 06:00 UTC

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/determinate-nix-action@v3

      # flake.lock (nixpkgs: Gradle, the JDK and JRE, PostgreSQL for the tests, the image's
      # CA bundle), then nix/deps.json: a new Gradle can fetch different plugin artifacts,
      # and the sandboxed build only sees what deps.json pins.
      - name: Update flake.lock and nix/deps.json
        # The update script sandboxes Gradle with bubblewrap, which needs the unprivileged
        # user namespaces Ubuntu's AppArmor denies; a throwaway runner needs no sandbox.
        env:
          USE_BWRAP: '0'
        run: |
          nix flake update
          nix build .#firefly-plaid-connector-2.mitmCache.updateScript --out-link update-deps
          ./update-deps
          rm update-deps

      - name: Open or update the PR
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automated/update-deps
          commit-message: Update dependencies
          title: Update dependencies
          labels: dependencies
          body: |
            Weekly update of `flake.lock` (`nix flake update`) and the Gradle dependency
            lockfile `nix/deps.json` (regenerated by the `mitmCache` update script).

            CI runs on this branch by dispatch, and merges the PR if it passes. Library
            versions in `build.gradle.kts` and `gradle/libs.versions.toml` do not change
            here: upstream bumped those with Dependabot, and in this fork they are left to a
            person.

      # A PR opened with GITHUB_TOKEN triggers no pull_request run, so start CI by hand.
      - name: Run CI on the branch
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref automated/update-deps
