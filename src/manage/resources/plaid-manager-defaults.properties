# Defaults for syncMode=manage only, loaded at the lowest precedence by
# ConnectorModeEnvironmentPostProcessor.

server.port=8080
# The dashboard shares an origin with Firefly behind the firefly-edge nginx, which routes
# /plaid/ here without stripping the prefix.
server.servlet.context-path=/plaid
# The edge sets X-Forwarded-Proto: https and passes Host through.
server.forward-headers-strategy=framework

# Laravel owns XSRF-TOKEN and its own session cookie at Path=/, so this cookie has its own
# name and is scoped to /plaid. SameSite=Lax (not Strict) so the top-level navigation back
# from a bank's OAuth page arrives logged in.
server.servlet.session.cookie.name=PLAIDSESSION
server.servlet.session.cookie.path=/plaid
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
# Idle timeout. The 8 hour absolute limit is AbsoluteSessionTimeoutFilter.
server.servlet.session.timeout=30m
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never

# Log tails are streamed for as long as the viewer keeps the page open, up to this long.
spring.mvc.async.request-timeout=30m
spring.thymeleaf.cache=true
spring.main.banner-mode=off
