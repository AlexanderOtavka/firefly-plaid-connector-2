<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Error')}"></head>
<body>
<header th:replace="~{fragments :: page-header-plain}"></header>
<main class="content content-narrow">
    <section class="box box-danger">
        <div class="box-header"><h1 class="box-title">Something went wrong</h1></div>
        <div class="box-body">
            <p th:text="${message}">Message</p>
        </div>
        <div class="box-footer actions">
            <a class="btn btn-default" th:href="@{/}">Back to the dashboard</a>
        </div>
    </section>
</main>
</body>
</html>
